<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Axion - Ultra Price Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --app-bg: #030712;
            --glass-bg: rgba(17, 24, 39, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --brand-primary: #f97316;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--app-bg); 
            color: #f9fafb; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .glass-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); 
        }
        .glass-nav { 
            background: rgba(3, 7, 18, 0.95); 
            backdrop-filter: blur(20px); 
            border-top: 1px solid var(--glass-border); 
        }
        .axion-glow { box-shadow: 0 0 35px -5px rgba(249, 115, 22, 0.4); }
        .axion-gradient { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }

        .btn-interact { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .btn-interact:active:not(:disabled) { transform: scale(0.95); }

        .card-hover { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .card-hover:hover { transform: translateY(-3px); border-color: rgba(249, 115, 22, 0.4); }

        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-toast { animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    </style>
</head>
<body class="min-h-screen pb-28 select-none font-sans antialiased bg-[#030712]">

    <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-[9999] w-11/12 max-w-sm flex flex-col gap-2 pointer-events-none"></div>

    <header class="p-4 glass-nav flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="axion-gradient text-white w-10 h-10 rounded-2xl flex items-center justify-center font-black text-xl tracking-tighter shadow-lg axion-glow">
                AX
            </div>
            <div>
                <h1 class="text-sm font-black text-white tracking-wide flex items-center gap-1.5">
                    AXION <span class="text-[8px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-full font-mono font-bold">CLIENT ENGINE</span>
                </h1>
                <p class="text-[10px] text-gray-400 font-medium">Real-Time Price Intelligence</p>
            </div>
        </div>
        <button onclick="triggerPriceCheck()" id="refreshBtn" class="btn-interact bg-gray-800/80 hover:bg-gray-700 text-gray-200 text-xs px-3.5 py-2 rounded-xl border border-gray-700/80 font-bold flex items-center gap-2 shadow">
            <i class="fa-solid fa-rotate-right text-orange-500" id="refreshIcon"></i>
            <span>Tümünü Tara</span>
        </button>
    </header>

    <!-- TAB 1: RADAR / TAKİP LİSTESİ -->
    <main id="tab-home" class="p-4 space-y-4 max-w-md mx-auto">
        <div class="grid grid-cols-3 gap-2.5">
            <div class="glass-card p-3 rounded-2xl text-center card-hover flex flex-col justify-center">
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">Radarda</p>
                <span id="productCount" class="text-lg font-black text-orange-500">-</span>
            </div>
            <div class="glass-card p-3 rounded-2xl text-center card-hover flex flex-col justify-center">
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">Hedefte</p>
                <span id="targetHitCount" class="text-lg font-black text-emerald-400">-</span>
            </div>
            <div class="glass-card p-3 rounded-2xl text-center card-hover flex flex-col justify-center">
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-1">Mod</p>
                <span class="text-xs font-black text-emerald-400">CLIENT-DIRECT</span>
            </div>
        </div>

        <div id="productList" class="space-y-3">
            <div class="text-center py-12 glass-card rounded-3xl border border-gray-800">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3 text-orange-500"></i>
                <p class="text-xs text-gray-400 font-medium">Yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- TAB 2: AI KEŞFET -->
    <section id="tab-discover" class="p-4 max-w-md mx-auto hidden space-y-4">
        <div class="glass-card p-6 rounded-3xl border border-gray-800 shadow-2xl">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-2xl bg-blue-500/10 flex items-center justify-center border border-blue-500/20 shadow-inner">
                    <i class="fa-solid fa-brain text-blue-400 text-lg"></i>
                </div>
                <div>
                    <h2 class="text-sm font-black text-white">Canlı Mağaza Arama</h2>
                    <p class="text-[10px] text-gray-400">Aradığın ürünü yaz, direkt mağaza kartları dökülsün</p>
                </div>
            </div>

            <div class="relative">
                <input type="text" id="aiSearchQuery" placeholder="Ürün adı yazın (Örn: Logitech G29)..." onkeypress="if(event.key==='Enter') runAiSearch()" class="w-full bg-[#080d1a] border border-gray-800 rounded-2xl pl-11 pr-24 py-3.5 text-xs text-white focus:outline-none focus:border-blue-500 transition shadow-inner">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
                <button onclick="runAiSearch()" id="aiSearchBtn" class="btn-interact absolute right-2 top-1/2 -translate-y-1/2 bg-blue-600 hover:bg-blue-500 text-white text-[10px] px-3.5 py-2 rounded-xl font-bold flex items-center gap-1 shadow">
                    <i class="fa-solid fa-bolt"></i> Ara
                </button>
            </div>

            <div class="flex gap-2 pt-3 overflow-x-auto no-scrollbar">
                <button onclick="quickSearch('PS5 Console')" class="btn-interact text-[10px] font-bold px-3 py-1.5 bg-gray-800/80 text-gray-300 rounded-xl border border-gray-700 whitespace-nowrap">🎮 PS5</button>
                <button onclick="quickSearch('Logitech G29')" class="btn-interact text-[10px] font-bold px-3 py-1.5 bg-gray-800/80 text-gray-300 rounded-xl border border-gray-700 whitespace-nowrap">🏎️ G29 Direksiyon</button>
                <button onclick="quickSearch('iPhone 15')" class="btn-interact text-[10px] font-bold px-3 py-1.5 bg-gray-800/80 text-gray-300 rounded-xl border border-gray-700 whitespace-nowrap">📱 iPhone 15</button>
            </div>
        </div>

        <div id="aiSearchResults" class="space-y-3"></div>
    </section>

    <!-- TAB 3: MANUEL ÜRÜN EKLE -->
    <section id="tab-add" class="p-4 max-w-md mx-auto hidden space-y-4">
        <div class="glass-card p-6 rounded-3xl border border-gray-800 shadow-2xl">
            <div class="flex items-center gap-3 mb-5">
                <div class="w-10 h-10 rounded-2xl bg-orange-500/10 flex items-center justify-center border border-orange-500/20 shadow-inner">
                    <i class="fa-solid fa-crosshairs text-orange-500 text-base"></i>
                </div>
                <div>
                    <h2 class="text-sm font-black text-white">Direkt Link Yapıştırarak Ekle</h2>
                    <p class="text-[10px] text-gray-400">Ürün bağlantısını ver, cihazın canlı fiyatı çeksin</p>
                </div>
            </div>

            <form onsubmit="addNewProduct(event)" class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1.5 pl-1">Ürün Adı</label>
                    <input type="text" id="pName" placeholder="Örn: Logitech G29 Direksiyon" required class="w-full bg-[#080d1a] border border-gray-800 rounded-xl px-4 py-3.5 text-xs text-white focus:outline-none focus:border-orange-500 transition shadow-inner">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1.5 pl-1">Mağaza</label>
                        <select id="pStore" class="w-full bg-[#080d1a] border border-gray-800 rounded-xl px-3 py-3.5 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                            <option value="Trendyol">Trendyol</option>
                            <option value="Amazon TR">Amazon TR</option>
                            <option value="Hepsiburada">Hepsiburada</option>
                            <option value="N11">N11</option>
                            <option value="Diğer">Diğer Mağaza</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1.5 pl-1">Hedef Fiyat (₺)</label>
                        <input type="number" step="any" id="pTarget" placeholder="Örn: 12000" required class="w-full bg-[#080d1a] border border-gray-800 rounded-xl px-4 py-3.5 text-xs text-white focus:outline-none focus:border-orange-500 transition shadow-inner">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5 pl-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Ürün Bağlantısı (URL)</label>
                        <button type="button" onclick="pasteFromClipboard()" class="text-[10px] text-orange-400 hover:underline font-bold">Panodan Yapıştır</button>
                    </div>
                    <input type="url" id="pUrl" placeholder="https://www.trendyol.com/... veya amzn.eu/..." required class="w-full bg-[#080d1a] border border-gray-800 rounded-xl px-4 py-3.5 text-xs text-white focus:outline-none focus:border-orange-500 transition shadow-inner">
                </div>

                <button type="submit" id="submitBtn" class="btn-interact w-full axion-gradient text-white font-bold text-xs py-4 rounded-xl mt-2 transition shadow-lg shadow-orange-950/40 flex items-center justify-center gap-2">
                    <span>Radara Al ve Fiyatı Çek</span>
                    <i class="fa-solid fa-rocket text-xs"></i>
                </button>
            </form>
        </div>
    </section>

    <!-- BOTTOM NAV -->
    <nav class="fixed bottom-0 left-0 right-0 glass-nav py-3 px-6 flex justify-around items-center z-50 max-w-md mx-auto">
        <button onclick="switchTab('home')" id="nav-home" class="nav-active btn-interact flex flex-col items-center text-xs">
            <i class="fa-solid fa-chart-line text-lg mb-1"></i>
            <span class="text-[10px] font-bold">Radar</span>
        </button>
        <button onclick="switchTab('discover')" id="nav-discover" class="btn-interact flex flex-col items-center text-gray-400 text-xs">
            <i class="fa-solid fa-compass text-lg mb-1"></i>
            <span class="text-[10px] font-bold">Keşfet</span>
        </button>
        <button onclick="switchTab('add')" id="nav-add" class="btn-interact flex flex-col items-center text-gray-400 text-xs relative">
            <div class="axion-gradient text-white p-3 rounded-full -mt-7 border-4 border-[#030712] shadow-lg shadow-orange-950/50 axion-glow">
                <i class="fa-solid fa-plus text-base"></i>
            </div>
            <span class="text-[10px] font-bold mt-1">Ekle</span>
        </button>
    </nav>

    <script>
        const API_URL = "https://fiyat-takip-backend.onrender.com/api";
        let chartInstances = {};

        const formatMoney = (amount) => {
            if (!amount || amount <= 0) return "Canlı Sayfada";
            return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 2 }).format(amount);
        };

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const styles = {
                success: 'bg-emerald-950/90 border-emerald-500/50 text-emerald-100 shadow-emerald-950/30',
                error: 'bg-rose-950/90 border-rose-500/50 text-rose-100 shadow-rose-950/30',
                info: 'bg-gray-900/90 border-orange-500/50 text-gray-100 shadow-orange-950/30'
            };
            const icons = {
                success: 'fa-circle-check text-emerald-400',
                error: 'fa-circle-xmark text-rose-400',
                info: 'fa-circle-info text-orange-400'
            };
            toast.className = `glass-card ${styles[type]} p-3.5 rounded-2xl border text-[11px] font-medium flex items-center gap-3 shadow-lg backdrop-blur-md animate-toast pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icons[type]} text-base"></i> <span class="flex-1">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px) scale(0.95)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // İSTEMCİ TARAFINDAN (KULLANICI IP'Sİ İLE) KESİNTİSİZ FİYAT AYRIŞTIRICI
        async function fetchPriceClientSide(url) {
            try {
                // 1. Trendyol Özel API Tüneli
                if (url.includes('trendyol.com')) {
                    const match = url.match(/[-/]p-(\d+)/) || url.match(/pi=(\d+)/);
                    if (match && match[1]) {
                        const pid = match[1];
                        try {
                            const res = await fetch(`https://public-mdc.trendyol.com/discovery-web-productdetail-gwb-service/api/productDetail/${pid}`);
                            if (res.ok) {
                                const data = await res.json();
                                const pInfo = data?.result?.price;
                                const val = pInfo?.discountedPrice?.value || pInfo?.sellingPrice?.value || pInfo?.originalPrice?.value;
                                if (val && val > 0) return parseFloat(val);
                            }
                        } catch(e){}
                    }
                }

                // 2. Genel Sayfa HTML İndirici (AllOrigins / CorsProxy)
                let html = "";
                try {
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                    const res = await fetch(proxyUrl);
                    if (res.ok) html = await res.text();
                } catch(e){}

                if (!html) {
                    try:
                        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                        const res = await fetch(proxyUrl);
                        if (res.ok) html = await res.text();
                    } catch(e){}
                }

                if (!html) return 0;

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Amazon Selector Taraması
                if (url.includes('amazon')) {
                    const el = doc.querySelector('span.a-price span.a-offscreen, .a-price-whole, #priceblock_ourprice');
                    if (el) {
                        const p = cleanPriceStr(el.textContent);
                        if (p > 0) return p;
                    }
                }

                // Hepsiburada / Trendyol DOM Taraması
                const el = doc.querySelector('span.prc-dsc, .prc-dsc, [data-test-id="price-current-price"], .price-bold, .product-price-container');
                if (el) {
                    const p = cleanPriceStr(el.textContent);
                    if (p > 0) return p;
                }

                // JSON-LD Taraması
                const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
                for (let script of scripts) {
                    try {
                        const data = JSON.parse(script.textContent);
                        const items = Array.isArray(data) ? data : [data];
                        for (let item of items) {
                            if (item.offers) {
                                const offers = Array.isArray(item.offers) ? item.offers : [item.offers];
                                for (let offer of offers) {
                                    const pRaw = offer.price || offer.lowPrice;
                                    const p = cleanPriceStr(pRaw);
                                    if (p > 0) return p;
                                }
                            }
                        }
                    } catch(e){}
                }

            } catch (err) {
                console.error("Client fetch hatası:", err);
            }
            return 0;
        }

        function cleanPriceStr(val) {
            if (!val) return 0;
            const str = String(val).replace(/\./g, '').replace(',', '.');
            const match = str.match(/\d+(\.\d+)?/);
            return match ? parseFloat(match[0]) : 0;
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text && text.startsWith('http')) {
                    document.getElementById('pUrl').value = text;
                    showToast("Bağlantı yapıştırıldı!", "success");
                }
            } catch (err) {}
        }

        function switchTab(tab) {
            ['home', 'discover', 'add'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('nav-active', 'text-orange-500', 'text-blue-400');
                document.getElementById(`nav-${t}`).classList.add('text-gray-400');
            });

            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tab}`);
            activeNav.classList.add('nav-active', tab === 'discover' ? 'text-blue-400' : 'text-orange-500');
            activeNav.classList.remove('text-gray-400');

            if(tab === 'home') loadProducts();
        }

        async function loadProducts() {
            const container = document.getElementById('productList');
            try {
                const res = await fetch(`${API_URL}/products`);
                if(!res.ok) throw new Error();
                const data = await res.json();
                
                let targetHitCount = 0;
                document.getElementById('productCount').innerText = data.length;
                container.innerHTML = '';

                if(data.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12 glass-card rounded-3xl border border-gray-800">
                            <i class="fa-solid fa-radar text-3xl text-gray-600 mb-3"></i>
                            <p class="text-xs text-gray-400 font-medium">Axion radarında henüz ürün yok.</p>
                        </div>`;
                    document.getElementById('targetHitCount').innerText = "0";
                    return;
                }

                data.forEach((item, index) => {
                    const currPrice = parseFloat(item.current_price) || 0;
                    const tgtPrice = parseFloat(item.target_price) || 0;
                    const initPrice = parseFloat(item.initial_price) || currPrice;
                    const isTarget = currPrice > 0 && currPrice <= tgtPrice;

                    if (isTarget) targetHitCount++;
                    const chartId = `chart-${index}`;

                    container.innerHTML += `
                        <div class="glass-card card-hover rounded-3xl p-4 relative border border-gray-800 flex flex-col gap-3">
                            ${isTarget ? '<span class="absolute top-0 right-0 bg-emerald-500 text-black font-black text-[9px] px-3 py-1 rounded-bl-xl shadow-md">🎯 HEDEF FİYAT KAZANILDI</span>' : ''}
                            
                            <div class="flex justify-between items-start">
                                <span class="text-[9px] bg-gray-800 text-orange-400 font-bold px-2.5 py-1 rounded-lg border border-gray-700">${item.store || 'Web'}</span>
                                <button onclick="deleteProduct('${item.id}')" class="text-gray-500 hover:text-rose-400 text-xs p-1">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>

                            <h3 class="font-bold text-xs text-white leading-snug line-clamp-2">${item.name}</h3>
                            
                            <div class="my-1 h-16 w-full">
                                <canvas id="${chartId}"></canvas>
                            </div>

                            <div class="flex justify-between items-end pt-2 border-t border-gray-800/80">
                                <div>
                                    <p class="text-[9px] text-gray-400 font-bold uppercase">Hedef: ${tgtPrice > 0 ? formatMoney(tgtPrice) : 'Belirtilmedi'}</p>
                                    <p class="text-base font-black ${isTarget ? 'text-emerald-400' : 'text-white'}">${formatMoney(currPrice)}</p>
                                </div>
                                <a href="${item.url}" target="_blank" class="btn-interact ${isTarget ? 'bg-emerald-500 text-black hover:bg-emerald-400' : 'axion-gradient text-white'} text-[10px] px-3.5 py-2 rounded-xl font-bold transition shadow flex items-center gap-1.5">
                                    <span>İncele</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                                </a>
                            </div>
                        </div>`;

                    setTimeout(() => renderChart(chartId, initPrice, currPrice), 100);
                });

                document.getElementById('targetHitCount').innerText = targetHitCount;

            } catch (err) {}
        }

        function renderChart(id, startPrice, currentPrice) {
            const ctx = document.getElementById(id);
            if(!ctx) return;
            if(chartInstances[id]) chartInstances[id].destroy();

            chartInstances[id] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Kayıt', 'Canlı'],
                    datasets: [{
                        data: [startPrice || 0, currentPrice || 0],
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        tension: 0.2,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
        }

        async function addNewProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Cihaz Canlı Fiyatı Çekiyor...</span>`;
            btn.disabled = true;

            const nameInput = document.getElementById('pName').value.trim();
            const targetPriceInput = parseFloat(document.getElementById('pTarget').value) || 0;
            const urlInput = document.getElementById('pUrl').value.trim();
            const storeInput = document.getElementById('pStore').value;

            // Fiyatı doğrudan cihaz üzerinden çekiyoruz
            showToast("Canlı fiyat cihazınızdan süzülüyor...", "info");
            const scrapedPrice = await fetchPriceClientSide(urlInput);

            const newProduct = {
                name: nameInput,
                store: storeInput,
                target_price: targetPriceInput,
                current_price: scrapedPrice > 0 ? scrapedPrice : 0,
                url: urlInput
            };

            try {
                const response = await fetch(`${API_URL}/add-product`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });

                if(response.ok) {
                    showToast("Ürün eklendi! 🚀", "success");
                    e.target.reset();
                    switchTab('home');
                }
            } catch (err) {
                showToast("Sunucu hatası.", "error");
            } finally {
                btn.innerHTML = `<span>Radara Al ve Fiyatı Çek</span> <i class="fa-solid fa-rocket text-xs"></i>`;
                btn.disabled = false;
            }
        }

        async function triggerPriceCheck() {
            const btn = document.getElementById('refreshBtn');
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');
            btn.disabled = true;

            showToast("Tüm ürünler cihazınızdan taranıyor...", "info");

            try {
                const res = await fetch(`${API_URL}/products`);
                const products = await res.json();

                for (let prod of products) {
                    const newPrice = await fetchPriceClientSide(prod.url);
                    if (newPrice > 0) {
                        await fetch(`${API_URL}/products/${prod.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ current_price: newPrice })
                        });
                    }
                }
                await loadProducts();
                showToast("Tüm fiyatlar başarıyla güncellendi!", "success");
            } catch(e) {
                showToast("Güncelleme tamamlandı.", "info");
            } finally {
                icon.classList.remove('fa-spin');
                btn.disabled = false;
            }
        }

        async function deleteProduct(id) {
            if(!confirm("Bu ürünü silmek istediğinize emin misiniz?")) return;
            try {
                const res = await fetch(`${API_URL}/products/${id}`, { method: 'DELETE' });
                if(res.ok) {
                    showToast("Ürün silindi.", "success");
                    loadProducts();
                }
            } catch(e) {}
        }

        function quickSearch(q) {
            document.getElementById('aiSearchQuery').value = q;
            runAiSearch();
        }

        async function runAiSearch() {
            const query = document.getElementById('aiSearchQuery').value.trim();
            const container = document.getElementById('aiSearchResults');
            if(!query) return;

            const qEncoded = encodeURIComponent(query);
            container.innerHTML = `
                <div class="glass-card rounded-3xl p-4 border border-gray-800 space-y-2">
                    <h4 class="text-xs font-bold text-white">Trendyol Arama Sayfası</h4>
                    <button onclick="directAddFromSearch('${query} - Trendyol', 'Trendyol', 'https://www.trendyol.com/sr?q=${qEncoded}')" class="btn-interact w-full axion-gradient text-white text-[10px] font-bold py-2 rounded-xl">Radara Ekle</button>
                </div>
                <div class="glass-card rounded-3xl p-4 border border-gray-800 space-y-2">
                    <h4 class="text-xs font-bold text-white">Amazon TR Arama Sayfası</h4>
                    <button onclick="directAddFromSearch('${query} - Amazon TR', 'Amazon TR', 'https://www.amazon.com.tr/s?k=${qEncoded}')" class="btn-interact w-full axion-gradient text-white text-[10px] font-bold py-2 rounded-xl">Radara Ekle</button>
                </div>`;
        }

        async function directAddFromSearch(name, store, url) {
            const newProduct = {
                name: name,
                store: store,
                target_price: 0,
                current_price: 0,
                url: url
            };

            const res = await fetch(`${API_URL}/add-product`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newProduct)
            });
            if(res.ok) {
                showToast("Arama linki radara eklendi!", "success");
                switchTab('home');
            }
        }

        loadProducts();
    </script>
</body>
</html>
