<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axion - Advanced Price Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { 
            background-color: #060911; 
            color: #f3f4f6; 
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glass-card { 
            background: rgba(17, 24, 39, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .glass-nav { 
            background: rgba(11, 15, 25, 0.85); 
            backdrop-filter: blur(16px); 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .axion-glow {
            box-shadow: 0 0 25px -5px rgba(249, 115, 22, 0.3);
        }
        .axion-gradient { 
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); 
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen pb-24 select-none">

    <!-- LOGIN / REGISTER MODAL -->
    <div id="authModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="glass-card w-full max-w-md p-6 rounded-3xl border border-gray-800 animate-slide-up shadow-2xl">
            <div class="text-center mb-6">
                <div class="axion-gradient w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-3 font-black text-2xl text-white shadow-lg axion-glow">
                    AX
                </div>
                <h2 class="text-xl font-black text-white tracking-wide">Axion Intelligence</h2>
                <p class="text-xs text-gray-400 mt-1" id="authTitle">Hesabınıza Giriş Yapın</p>
            </div>

            <div id="authAlert" class="hidden mb-4 p-3 rounded-xl text-xs font-bold text-center"></div>

            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-1">E-posta</label>
                    <input type="email" id="authEmail" placeholder="ornek@mail.com" required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Şifre</label>
                    <input type="password" id="authPassword" placeholder="••••••••" required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                </div>

                <div class="flex flex-col gap-2 pt-2">
                    <button type="submit" id="mainAuthBtn" class="w-full axion-gradient text-white font-bold text-xs py-3.5 rounded-xl transition shadow-lg shadow-orange-950/40">
                        Giriş Yap
                    </button>
                    <button type="button" onclick="toggleAuthMode()" id="switchAuthBtn" class="w-full bg-gray-800/60 hover:bg-gray-700 text-gray-300 border border-gray-700 font-bold text-xs py-3 rounded-xl transition">
                        Hesabın yok mu? Kayıt Ol
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="appContent" class="hidden">
        <header class="p-4 bg-[#0b0f19]/80 backdrop-blur-md border-b border-gray-800 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center space-x-3">
                <div class="axion-gradient text-white w-9 h-9 rounded-xl flex items-center justify-center font-black text-lg tracking-tighter shadow-md axion-glow">
                    AX
                </div>
                <div>
                    <h1 class="text-sm font-black text-white tracking-wider flex items-center gap-1.5">
                        AXION <span class="text-[9px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-1.5 py-0.2 rounded font-mono font-bold">PRO v2.0</span>
                    </h1>
                    <p class="text-[9px] text-gray-400" id="userEmailDisplay">Yükleniyor...</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs px-3 py-2 rounded-xl border border-red-500/20 transition flex items-center gap-1">
                    <i class="fa-solid fa-power-off"></i> Çıkış
                </button>
            </div>
        </header>

        <main id="tab-home" class="p-4 space-y-4 max-w-md mx-auto animate-slide-up">
            <div class="grid grid-cols-3 gap-2">
                <div class="glass-card p-3 rounded-2xl text-center">
                    <p class="text-[9px] text-gray-400 font-bold uppercase">Radarda</p>
                    <span id="productCount" class="text-lg font-black text-orange-500">0</span>
                </div>
                <div class="glass-card p-3 rounded-2xl text-center">
                    <p class="text-[9px] text-gray-400 font-bold uppercase">Hedefte</p>
                    <span id="targetHitCount" class="text-lg font-black text-emerald-400">0</span>
                </div>
                <div class="glass-card p-3 rounded-2xl text-center">
                    <p class="text-[9px] text-gray-400 font-bold uppercase">Tasarruf</p>
                    <span id="totalSavings" class="text-lg font-black text-blue-400">0 ₺</span>
                </div>
            </div>

            <div id="productList" class="space-y-3">
                <div class="text-center py-12 text-gray-500 text-xs">
                    <i class="fa-solid fa-circle-notch fa-spin text-lg mb-2 text-orange-500"></i>
                    <p>Canlı veriler yükleniyor...</p>
                </div>
            </div>
        </main>

        <section id="tab-add" class="p-4 max-w-md mx-auto hidden space-y-4 animate-slide-up">
            <div class="glass-card p-5 rounded-3xl border border-gray-800">
                <h2 class="text-sm font-black text-gray-100 mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-bullseye text-orange-500"></i> Radara Ürün Ekle
                </h2>
                
                <form onsubmit="addNewProduct(event)" class="space-y-3 mt-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Ürün Adı</label>
                        <input type="text" id="pName" placeholder="Örn: Sony DualSense PS5" required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Platform</label>
                            <select id="pStore" class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500">
                                <option value="Amazon">Amazon TR</option>
                                <option value="Trendyol">Trendyol</option>
                                <option value="Hepsiburada">Hepsiburada</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Hedef Fiyat (₺)</label>
                            <input type="number" id="pTarget" placeholder="2500" required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500">
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Ürün Linki (URL)</label>
                        <input type="url" id="pUrl" placeholder="https://..." required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full axion-gradient text-white font-bold text-xs py-3.5 rounded-xl mt-2 transition">
                        Takibe Başla 🚀
                    </button>
                </form>
            </div>
        </section>

        <nav class="fixed bottom-0 left-0 right-0 glass-nav py-3 px-8 flex justify-around items-center z-50 max-w-md mx-auto">
            <button onclick="switchTab('home')" id="nav-home" class="nav-active flex flex-col items-center text-xs">
                <i class="fa-solid fa-chart-line text-base mb-1"></i>
                <span class="text-[10px] font-bold">Radar</span>
            </button>
            <button onclick="switchTab('add')" id="nav-add" class="flex flex-col items-center text-gray-400 text-xs">
                <div class="axion-gradient text-white p-3 rounded-full -mt-6 border-4 border-[#060911] shadow-lg axion-glow">
                    <i class="fa-solid fa-plus text-sm"></i>
                </div>
                <span class="text-[10px] font-bold">Ekle</span>
            </button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = "https://rgrborzdgbslwmixszyl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_UqT3G_hrhUFarwUEZ6UBxA_BWZpfWHw";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;
        let isLoginMode = true;

        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            if(user) {
                currentUser = user;
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
                loadProducts();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('appContent').classList.add('hidden');
            }
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('authTitle');
            const mainBtn = document.getElementById('mainAuthBtn');
            const switchBtn = document.getElementById('switchAuthBtn');
            
            if(isLoginMode) {
                title.innerText = "Hesabınıza Giriş Yapın";
                mainBtn.innerText = "Giriş Yap";
                switchBtn.innerText = "Hesabın yok mu? Kayıt Ol";
            } else {
                title.innerText = "Yeni Axion Hesabı Oluştur";
                mainBtn.innerText = "Kayıt Ol";
                switchBtn.innerText = "Zaten hesabın var mı? Giriş Yap";
            }
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('authAlert');
            alertBox.classList.remove('hidden', 'bg-red-500/20', 'text-red-400', 'bg-emerald-500/20', 'text-emerald-400');
            alertBox.classList.add(isSuccess ? 'bg-emerald-500/20' : 'bg-red-500/20', isSuccess ? 'text-emerald-400' : 'text-red-400');
            alertBox.innerText = msg;
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if(!isLoginMode) {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if(error) {
                    showAlert(error.message);
                } else {
                    showAlert("Kayıt başarılı! E-postana doğrulama bağlantısı gönderildi. Lütfen e-postanı kontrol et.", true);
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if(error) {
                    showAlert("Giriş başarısız: " + error.message);
                } else {
                    checkAuth();
                }
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            checkAuth();
        }

        function switchTab(tab) {
            ['home', 'add'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('text-orange-500');
                document.getElementById(`nav-${t}`).classList.add('text-gray-400');
            });

            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('text-orange-500');
            document.getElementById(`nav-${tab}`).classList.remove('text-gray-400');

            if(tab === 'home') loadProducts();
        }

        async function loadProducts() {
            const container = document.getElementById('productList');
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                renderProductList(data || []);
            } catch (err) {
                console.error(err);
            }
        }

        function renderProductList(products) {
            const container = document.getElementById('productList');
            document.getElementById('productCount').innerText = products.length;
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 glass-card rounded-3xl">
                        <i class="fa-solid fa-radar text-3xl text-gray-600 mb-2"></i>
                        <p class="text-xs text-gray-400">Takip edilen ürün yok.</p>
                        <button onclick="switchTab('add')" class="mt-3 text-xs axion-gradient text-white px-4 py-2 rounded-xl font-bold">Ürün Ekle</button>
                    </div>`;
                return;
            }

            products.forEach((item) => {
                container.innerHTML += `
                    <div class="glass-card rounded-3xl p-4 border border-gray-800">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[9px] bg-gray-800 text-orange-400 font-bold px-2 py-0.5 rounded-md uppercase">${item.store}</span>
                            <button onclick="deleteProduct(${item.id})" class="text-gray-600 hover:text-red-400 text-xs">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <h3 class="font-bold text-sm text-gray-100 mb-2">${item.name}</h3>
                        <div class="flex justify-between items-end pt-2 border-t border-gray-800">
                            <div>
                                <p class="text-[10px] text-gray-400">Hedef: ${item.target_price} ₺</p>
                                <p class="text-base font-black text-emerald-400">${item.current_price} ₺</p>
                            </div>
                            <a href="${item.url}" target="_blank" class="axion-gradient text-white text-xs px-3.5 py-2 rounded-xl font-bold">Satın Al</a>
                        </div>
                    </div>`;
            });
        }

        async function deleteProduct(id) {
            if(!confirm("Silmek istediğinize emin misiniz?")) return;
            await supabase.from('products').delete().eq('id', id);
            loadProducts();
        }

        async function addNewProduct(e) {
            e.preventDefault();
            const newProduct = {
                user_id: currentUser.id,
                name: document.getElementById('pName').value,
                store: document.getElementById('pStore').value,
                target_price: parseFloat(document.getElementById('pTarget').value),
                current_price: parseFloat(document.getElementById('pTarget').value),
                initial_price: parseFloat(document.getElementById('pTarget').value),
                url: document.getElementById('pUrl').value
            };

            await supabase.from('products').insert([newProduct]);
            e.target.reset();
            switchTab('home');
        }

        checkAuth();
    </script>
</body>
</html>
