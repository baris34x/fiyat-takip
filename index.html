<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axion Pro - Fiyat Takip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { background-color: #060911; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(16px); border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .axion-glow { box-shadow: 0 0 25px -5px rgba(249, 115, 22, 0.3); }
        .axion-gradient { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .btn-interact { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .btn-interact:active { transform: scale(0.94); filter: brightness(0.9); }
        .card-hover { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .card-hover:hover { transform: translateY(-2px); border-color: rgba(249, 115, 22, 0.3); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-toast { animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    </style>
</head>
<body class="min-h-screen pb-24 select-none">

    <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-[120] w-11/12 max-w-sm space-y-2 pointer-events-none"></div>

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="glass-card w-full max-w-md p-6 rounded-3xl border border-gray-800 animate-slide-up shadow-2xl">
            <div class="text-center mb-6">
                <div class="axion-gradient w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-3 font-black text-2xl text-white shadow-lg axion-glow">
                    AX
                </div>
                <h2 class="text-xl font-black text-white tracking-wide">Axion Intelligence</h2>
                <p class="text-xs text-gray-400 mt-1">Gelişmiş Fiyat Takip Platformu</p>
            </div>

            <div id="verifyNotice" class="hidden mb-5 p-5 rounded-2xl bg-orange-500/10 border border-orange-500/30 text-center animate-slide-up space-y-3">
                <i class="fa-solid fa-envelope-circle-check text-4xl text-orange-400"></i>
                <div>
                    <h3 class="text-sm font-bold text-white">E-Posta Doğrulaması Gerekli</h3>
                    <p class="text-[11px] text-gray-300 mt-1 leading-relaxed">
                        <b id="registeredEmailText" class="text-orange-400"></b> adresine doğrulama bağlantısı gönderdik.
                    </p>
                </div>
                <div class="pt-2 flex flex-col gap-2">
                    <button type="button" id="resendBtn" onclick="resendVerification()" class="btn-interact w-full text-xs bg-orange-500/20 hover:bg-orange-500/30 text-orange-300 border border-orange-500/40 px-4 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 transition">
                        <i class="fa-solid fa-paper-plane"></i> <span id="resendBtnText">Tekrar Gönder</span>
                    </button>
                    <button type="button" onclick="resetAuthView()" class="btn-interact w-full text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-xl font-bold transition">
                        Giriş Ekranına Dön
                    </button>
                </div>
            </div>

            <div id="authFormContainer">
                <div class="flex p-1 bg-[#090d16] border border-gray-800 rounded-2xl mb-5">
                    <button type="button" id="tabLoginBtn" class="btn-interact flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 bg-orange-500 text-white shadow-md">
                        Giriş Yap
                    </button>
                    <button type="button" id="tabRegisterBtn" class="btn-interact flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 text-gray-400 hover:text-white">
                        Kayıt Ol
                    </button>
                </div>

                <form id="authForm" class="space-y-3">
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-1">E-posta</label>
                        <input type="email" id="authEmail" placeholder="ornek@mail.com" required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Şifre</label>
                        <input type="password" id="authPassword" placeholder="••••••••" required minlength="6" class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <div id="confirmPasswordGroup" class="hidden">
                        <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Şifre Tekrarı</label>
                        <input type="password" id="authConfirmPassword" placeholder="••••••••" class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <button type="submit" id="mainAuthBtn" class="btn-interact w-full axion-gradient text-white font-bold text-xs py-3.5 rounded-xl transition shadow-lg shadow-orange-950/40 mt-2 flex items-center justify-center gap-2">
                        <span>Giriş Yap</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- APP CONTENT -->
    <div id="appContent" class="hidden">
        <header class="p-4 bg-[#0b0f19]/80 backdrop-blur-md border-b border-gray-800 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center space-x-3">
                <div class="axion-gradient text-white w-9 h-9 rounded-xl flex items-center justify-center font-black text-lg tracking-tighter shadow-md axion-glow">
                    AX
                </div>
                <div>
                    <h1 class="text-sm font-black text-white tracking-wider flex items-center gap-1.5">
                        AXION <span class="text-[9px] bg-orange-500/20 text-orange-400 border border-orange-500/30 px-1.5 py-0.2 rounded font-mono font-bold">PRO v3.0</span>
                    </h1>
                    <p class="text-[9px] text-gray-400 truncate max-w-[180px]" id="userEmailDisplay">Yükleniyor...</p>
                </div>
            </div>
            <button onclick="logout()" class="btn-interact bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs px-3 py-2 rounded-xl border border-red-500/20 transition flex items-center gap-1">
                <i class="fa-solid fa-power-off"></i> Çıkış
            </button>
        </header>

        <main id="tab-home" class="p-4 space-y-4 max-w-md mx-auto animate-slide-up">
            <div class="grid grid-cols-3 gap-2">
                <div class="glass-card p-3 rounded-2xl text-center card-hover">
                    <p class="text-[9px] text-gray-400 font-bold uppercase">Radarda</p>
                    <span id="productCount" class="text-lg font-black text-orange-500">0</span>
                </div>
                <div class="glass-card p-3 rounded-2xl text-center card-hover">
                    <p class="text-[9px] text-gray-400 font-bold uppercase">Hedefte</p>
                    <span id="targetHitCount" class="text-lg font-black text-emerald-400">0</span>
                </div>
                <div class="glass-card p-3 rounded-2xl text-center card-hover">
                    <p class="text-[9px] text-gray-400 font-bold uppercase">Tasarruf</p>
                    <span id="totalSavings" class="text-lg font-black text-blue-400">0 ₺</span>
                </div>
            </div>

            <div id="productList" class="space-y-3">
                <div class="text-center py-12 text-gray-500 text-xs">
                    <i class="fa-solid fa-circle-notch fa-spin text-lg mb-2 text-orange-500"></i>
                    <p>Canlı veriler yükleniyor...</p>
                </div>
            </div>
        </main>

        <section id="tab-add" class="p-4 max-w-md mx-auto hidden space-y-4 animate-slide-up">
            <div class="glass-card p-5 rounded-3xl border border-gray-800">
                <h2 class="text-sm font-black text-gray-100 mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-bullseye text-orange-500"></i> Radara Ürün Ekle
                </h2>
                <form id="addProductForm" class="space-y-3 mt-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Ürün Adı</label>
                        <input type="text" id="pName" placeholder="Örn: Sony DualSense PS5" required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Platform</label>
                            <select id="pStore" class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                                <option value="Amazon">Amazon TR</option>
                                <option value="Trendyol">Trendyol</option>
                                <option value="Hepsiburada">Hepsiburada</option>
                                <option value="N11">N11</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Mevcut Fiyat (₺)</label>
                            <input type="number" id="pCurrent" placeholder="3500" step="0.01" required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Hedef Fiyat (₺)</label>
                        <input type="number" id="pTarget" placeholder="2500" step="0.01" required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase block mb-1">Ürün Linki (URL)</label>
                        <input type="url" id="pUrl" placeholder="https://..." required class="w-full bg-[#090d16] border border-gray-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <button type="submit" id="addProductBtn" class="btn-interact w-full axion-gradient text-white font-bold text-xs py-3.5 rounded-xl mt-2 transition flex items-center justify-center gap-2">
                        <span>Takibe Başla 🚀</span>
                    </button>
                </form>
            </div>
        </section>

        <nav class="fixed bottom-0 left-0 right-0 glass-nav py-3 px-8 flex justify-around items-center z-50 max-w-md mx-auto">
            <button onclick="switchTab('home')" id="nav-home" class="btn-interact flex flex-col items-center text-orange-500">
                <i class="fa-solid fa-chart-line text-base mb-1"></i>
                <span class="text-[10px] font-bold">Radar</span>
            </button>
            <button onclick="switchTab('add')" id="nav-add" class="btn-interact flex flex-col items-center text-gray-400">
                <div class="axion-gradient text-white p-3 rounded-full -mt-6 border-4 border-[#060911] shadow-lg axion-glow">
                    <i class="fa-solid fa-plus text-sm"></i>
                </div>
                <span class="text-[10px] font-bold">Ekle</span>
            </button>
        </nav>
    </div>

    <script>
        // Global scope - HTML onclick erişimi için
        let db = null;
        let currentUser = null;
        let currentAuthMode = 'login';
        let resendTimer = null;
        let lastRegisteredEmail = "";

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgColors = type === 'success' 
                ? 'bg-emerald-900/90 border-emerald-500 text-emerald-200' 
                : type === 'error' 
                ? 'bg-red-900/90 border-red-500 text-red-200' 
                : 'bg-gray-900/90 border-orange-500 text-orange-200';
            let icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-bell';
            toast.className = `glass-card ${bgColors} p-3.5 rounded-2xl border text-xs font-bold flex items-center gap-3 shadow-2xl backdrop-blur-md animate-toast pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span class="flex-1">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function resetAuthView() {
            document.getElementById('verifyNotice').classList.add('hidden');
            document.getElementById('authFormContainer').classList.remove('hidden');
            setAuthMode('login');
        }

        async function resendVerification() {
            if (!lastRegisteredEmail) return;
            const resendBtn = document.getElementById('resendBtn');
            const resendBtnText = document.getElementById('resendBtnText');
            resendBtn.disabled = true;
            try {
                const { error } = await db.auth.resend({
                    type: 'signup',
                    email: lastRegisteredEmail,
                    options: { emailRedirectTo: window.location.origin }
                });
                if (error) {
                    showToast("Gönderilemedi: " + error.message, "error");
                    resendBtn.disabled = false;
                } else {
                    showToast("Doğrulama bağlantısı tekrar gönderildi!", "success");
                    startResendCountdown(30);
                }
            } catch (err) {
                showToast("Hata: " + err.message, "error");
                resendBtn.disabled = false;
            }
        }

        function startResendCountdown(seconds) {
            const resendBtn = document.getElementById('resendBtn');
            const resendBtnText = document.getElementById('resendBtnText');
            let count = seconds;
            resendBtn.disabled = true;
            resendBtnText.innerText = `Tekrar Gönder (${count}s)`;
            clearInterval(resendTimer);
            resendTimer = setInterval(() => {
                count--;
                if (count > 0) {
                    resendBtnText.innerText = `Tekrar Gönder (${count}s)`;
                } else {
                    clearInterval(resendTimer);
                    resendBtnText.innerText = "Tekrar Gönder";
                    resendBtn.disabled = false;
                }
            }, 1000);
        }

        function setAuthMode(mode) {
            currentAuthMode = mode;
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');
            const confirmGroup = document.getElementById('confirmPasswordGroup');
            const confirmInput = document.getElementById('authConfirmPassword');
            const mainAuthBtn = document.getElementById('mainAuthBtn');

            if (mode === 'login') {
                tabLoginBtn.className = "btn-interact flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 bg-orange-500 text-white shadow-md";
                tabRegisterBtn.className = "btn-interact flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 text-gray-400 hover:text-white";
                confirmGroup.classList.add('hidden');
                confirmInput.removeAttribute('required');
                mainAuthBtn.innerHTML = '<span>Giriş Yap</span>';
            } else {
                tabRegisterBtn.className = "btn-interact flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 bg-orange-500 text-white shadow-md";
                tabLoginBtn.className = "btn-interact flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 text-gray-400 hover:text-white";
                confirmGroup.classList.remove('hidden');
                confirmInput.setAttribute('required', 'true');
                mainAuthBtn.innerHTML = '<span>Hesap Oluştur</span>';
            }
        }

        async function checkAuth() {
            const { data: { user }, error } = await db.auth.getUser();
            if (error) {
                console.error('Auth check error:', error);
                showAuthModal();
                return;
            }
            if (user) {
                currentUser = user;
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
                loadProducts();
            } else {
                showAuthModal();
            }
        }

        function showAuthModal() {
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('appContent').classList.add('hidden');
        }

        async function logout() {
            showToast("Oturum kapatıldı.", "info");
            await db.auth.signOut();
            currentUser = null;
            checkAuth();
        }

        function switchTab(tab) {
            ['home', 'add'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                const nav = document.getElementById(`nav-${t}`);
                nav.classList.remove('text-orange-500');
                nav.classList.add('text-gray-400');
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tab}`);
            activeNav.classList.add('text-orange-500');
            activeNav.classList.remove('text-gray-400');
            if (tab === 'home') loadProducts();
        }

        async function loadProducts() {
            if (!currentUser) return;
            try {
                const { data, error } = await db
                    .from('products')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });
                if (error) throw error;
                renderProductList(data || []);
            } catch (err) {
                console.error('Load error:', err);
                showToast("Ürünler yüklenemedi: " + err.message, "error");
            }
        }

        function renderProductList(products) {
            const container = document.getElementById('productList');
            document.getElementById('productCount').innerText = products.length;

            // İstatistikler
            let targetHits = 0, savings = 0;
            products.forEach(p => {
                if (Number(p.current_price) <= Number(p.target_price)) targetHits++;
                const init = Number(p.initial_price || p.current_price);
                const curr = Number(p.current_price);
                if (init > curr) savings += (init - curr);
            });
            document.getElementById('targetHitCount').innerText = targetHits;
            document.getElementById('totalSavings').innerText = Math.round(savings) + ' ₺';

            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 glass-card rounded-3xl animate-slide-up">
                        <i class="fa-solid fa-radar text-3xl text-gray-600 mb-2"></i>
                        <p class="text-xs text-gray-400">Takip edilen ürün yok.</p>
                        <button onclick="switchTab('add')" class="btn-interact mt-3 text-xs axion-gradient text-white px-4 py-2 rounded-xl font-bold shadow-md">Ürün Ekle</button>
                    </div>`;
                return;
            }

            products.forEach(item => {
                const isHit = Number(item.current_price) <= Number(item.target_price);
                const diff = Number(item.initial_price) - Number(item.current_price);
                const diffPct = item.initial_price ? Math.round((diff / Number(item.initial_price)) * 100) : 0;
                const diffColor = diff > 0 ? 'text-emerald-400' : diff < 0 ? 'text-red-400' : 'text-gray-400';
                const diffIcon = diff > 0 ? 'fa-arrow-down' : diff < 0 ? 'fa-arrow-up' : 'fa-minus';

                container.innerHTML += `
                    <div class="glass-card card-hover rounded-3xl p-4 border border-gray-800 animate-slide-up">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[9px] bg-gray-800 text-orange-400 font-bold px-2 py-0.5 rounded-md uppercase tracking-wider">${item.store}</span>
                            <button onclick="deleteProduct(${item.id})" class="btn-interact text-gray-500 hover:text-red-400 text-xs p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <h3 class="font-bold text-sm text-gray-100 mb-2">${item.name}</h3>
                        ${isHit ? '<span class="inline-block text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-md font-bold mb-2">🎯 HEDEFE ULAŞTI!</span>' : ''}
                        <div class="flex justify-between items-end pt-2 border-t border-gray-800">
                            <div class="flex-1">
                                <p class="text-[10px] text-gray-400">Hedef: ${item.target_price} ₺</p>
                                <p class="text-base font-black ${isHit ? 'text-emerald-400' : 'text-orange-400'}">${item.current_price} ₺</p>
                                <p class="text-[10px] ${diffColor} mt-0.5">
                                    <i class="fa-solid ${diffIcon}"></i> ${Math.abs(diffPct)}% (${Math.abs(diff).toFixed(0)} ₺)
                                </p>
                            </div>
                            <a href="${item.url}" target="_blank" class="btn-interact axion-gradient text-white text-xs px-3.5 py-2 rounded-xl font-bold shadow-md">Satın Al</a>
                        </div>
                    </div>`;
            });
        }

        async function deleteProduct(id) {
            if (!confirm("Bu ürünü radardan kaldırmak istediğinize emin misiniz?")) return;
            try {
                const { error } = await db.from('products').delete().eq('id', id).eq('user_id', currentUser.id);
                if (error) throw error;
                showToast("Ürün silindi.", "success");
                loadProducts();
            } catch (err) {
                showToast("Silme hatası: " + err.message, "error");
            }
        }

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            const SUPABASE_URL = "https://rgrborzdgbslwmixszyl.supabase.co";
            const SUPABASE_ANON_KEY = "sb_publishable_UqT3G_hrhUFarwUEZ6UBxA_BWZpfWHw";

            try {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                });
            } catch (e) {
                showToast("Supabase bağlantı hatası", "error");
                return;
            }

            // Tab butonları
            document.getElementById('tabLoginBtn').addEventListener('click', () => setAuthMode('login'));
            document.getElementById('tabRegisterBtn').addEventListener('click', () => setAuthMode('register'));

            // AUTH FORM SUBMIT
            document.getElementById('authForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('authEmail').value.trim();
                const password = document.getElementById('authPassword').value;
                const mainAuthBtn = document.getElementById('mainAuthBtn');

                mainAuthBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>İşlem Yapılıyor...</span>';
                mainAuthBtn.disabled = true;

                try {
                    if (currentAuthMode === 'register') {
                        const confirmPassword = document.getElementById('authConfirmPassword').value;
                        if (password !== confirmPassword) {
                            showToast("Şifreler birbiriyle eşleşmiyor!", "error");
                            return;
                        }
                        if (password.length < 6) {
                            showToast("Şifre en az 6 karakter olmalı!", "error");
                            return;
                        }

                        const { data, error } = await db.auth.signUp({
                            email,
                            password,
                            options: { emailRedirectTo: window.location.origin }
                        });

                        if (error) {
                            showToast(error.message, "error");
                        } else if (data.user && !data.session) {
                            // E-posta doğrulama gerekli
                            lastRegisteredEmail = email;
                            document.getElementById('registeredEmailText').innerText = email;
                            document.getElementById('authFormContainer').classList.add('hidden');
                            document.getElementById('verifyNotice').classList.remove('hidden');
                            showToast("Doğrulama e-postası gönderildi!", "success");
                            startResendCountdown(30);
                        } else if (data.session) {
                            // Doğrulama kapalıysa direkt giriş
                            showToast("Hesap oluşturuldu!", "success");
                            await checkAuth();
                        }
                    } else {
                        const { data, error } = await db.auth.signInWithPassword({ email, password });

                        if (error) {
                            if (error.message.includes('Email not confirmed')) {
                                lastRegisteredEmail = email;
                                document.getElementById('registeredEmailText').innerText = email;
                                document.getElementById('authFormContainer').classList.add('hidden');
                                document.getElementById('verifyNotice').classList.remove('hidden');
                                showToast("Önce e-postanızı doğrulayın!", "error");
                            } else if (error.message.includes('Invalid login')) {
                                showToast("E-posta veya şifre hatalı!", "error");
                            } else {
                                showToast("Giriş hatası: " + error.message, "error");
                            }
                        } else {
                            showToast("Giriş başarılı! 🎉", "success");
                            await checkAuth();
                        }
                    }
                } catch (err) {
                    console.error('Auth error:', err);
                    showToast("Sistem hatası: " + err.message, "error");
                } finally {
                    mainAuthBtn.innerHTML = currentAuthMode === 'login' ? '<span>Giriş Yap</span>' : '<span>Hesap Oluştur</span>';
                    mainAuthBtn.disabled = false;
                }
            });

            // ÜRÜN EKLEME FORMU
            document.getElementById('addProductForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentUser) {
                    showToast("Lütfen giriş yapın!", "error");
                    return;
                }
                const addBtn = document.getElementById('addProductBtn');
                addBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Ekleniyor...</span>';
                addBtn.disabled = true;

                try {
                    const currentPrice = parseFloat(document.getElementById('pCurrent').value);
                    const newProduct = {
                        user_id: currentUser.id,
                        name: document.getElementById('pName').value.trim(),
                        store: document.getElementById('pStore').value,
                        target_price: parseFloat(document.getElementById('pTarget').value),
                        current_price: currentPrice,
                        initial_price: currentPrice,
                        url: document.getElementById('pUrl').value.trim()
                    };

                    const { data, error } = await db.from('products').insert([newProduct]).select();
                    if (error) throw error;

                    showToast("Ürün radara eklendi! 🚀", "success");
                    e.target.reset();
                    switchTab('home');
                } catch (err) {
                    console.error('Add error:', err);
                    showToast("Eklenemedi: " + err.message, "error");
                } finally {
                    addBtn.innerHTML = '<span>Takibe Başla 🚀</span>';
                    addBtn.disabled = false;
                }
            });

            // Supabase auth state listener
            db.auth.onAuthStateChange((event, session) => {
                console.log('Auth event:', event);
                if (event === 'SIGNED_IN' && session?.user) {
                    currentUser = session.user;
                    document.getElementById('authModal').classList.add('hidden');
                    document.getElementById('appContent').classList.remove('hidden');
                    document.getElementById('userEmailDisplay').innerText = session.user.email;
                    loadProducts();
                } else if (event === 'SIGNED_OUT') {
                    currentUser = null;
                    showAuthModal();
                }
            });

            // İlk auth kontrolü
            checkAuth();
        });
    </script>
</body>
</html>
